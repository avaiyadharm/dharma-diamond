services:
  db:
    image: postgres:16-alpine
    container_name: dharma-diamond-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dharma_diamond}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dharma_diamond}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: dharma-diamond-backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dharma_diamond}
      SECRET_KEY: ${SECRET_KEY:-change-this-dev-secret-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dharmadiamond.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Dharma Diamond Admin}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
